<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>GTF Scanner</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#667085;--ln:#e4e7ec;--buy:#087443;--sell:#b42318;--acc:#1d4ed8}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--tx:#e8ebf0;--mut:#8b94a3;--ln:#2a303b;--buy:#3ddc97;--sell:#ff7a70;--acc:#7aa2ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding:12px 16px 40px}
h1{font-size:18px;margin:4px 0}.sub{color:var(--mut);font-size:12px;margin-bottom:10px}
.lab{font-size:11px;color:var(--mut);margin:8px 0 2px;text-transform:uppercase;letter-spacing:.04em}
.bar{display:flex;gap:6px;flex-wrap:wrap}
.bar button{border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:7px 11px;border-radius:999px;font-size:13px}
.bar button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.cnt{margin:12px 0 4px;font-weight:600}
.c{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:10px 0}
.t{display:flex;justify-content:space-between;align-items:baseline}.sym{font-weight:700;font-size:16px}
.buy{color:var(--buy);font-weight:700}.sell{color:var(--sell);font-weight:700}
.tag{font-size:11px;border:1px solid var(--ln);border-radius:6px;padding:1px 6px;color:var(--mut);margin-left:4px;white-space:nowrap}
.tag.hot{color:var(--acc);border-color:var(--acc)}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.g div{font-size:11px;color:var(--mut)}.g b{display:block;color:var(--tx);font-size:14px}
.m{font-size:12px;color:var(--mut)}.empty{color:var(--mut);text-align:center;padding:30px 0}
</style></head><body>
<h1>GTF Scanner · F&amp;O</h1><div class="sub" id="meta">loading…</div>
<div class="lab">Quality (min trade score)</div><div class="bar" id="fq"></div>
<div class="lab">Mode</div><div class="bar" id="fm"></div>
<div class="lab">Side</div><div class="bar" id="fs"></div>
<div class="lab">Show</div><div class="bar" id="fx"></div>
<div class="cnt" id="cnt"></div><div id="list"></div>
<script>
const F={q:7,mode:'all',side:'all',show:'act'};let D=null;
const NAME={all:'All',daily:'Daily',monthly:'Monthly',quarterly:'Quarterly',BUY:'Buy',SELL:'Sell',SET_LIMIT:'Type 1',TYPE2_TRIGGER:'Type 2',TYPE3_CONFIRMED:'Type 3',WATCH:'Watch'};
const QOPT=[[7,'7+ Quality'],[6,'6+'],[5,'5+ All']];
const SOPT=[['act','Entry ready'],['near','+ Near (≤1.5%)'],['all','Everything']];
function bar(id,opts,cur,fn){const e=document.getElementById(id);e.innerHTML='';opts.forEach(([v,l])=>{const b=document.createElement('button');b.textContent=l;b.className=(cur==v)?'on':'';b.onclick=()=>{fn(v);draw()};e.appendChild(b)})}
const dist=s=>Math.abs(s.cmp-s.plan.entry)/s.cmp*100;
function pick(){
  let r=D.signals.filter(s=>s.score>=F.q&&(F.mode=='all'||s.mode==F.mode)&&(F.side=='all'||s.plan.side==F.side));
  if(F.show=='act')r=r.filter(s=>s.status!='WATCH'||dist(s)<=0.5);       // triggered, or price already at the entry line
  else if(F.show=='near')r=r.filter(s=>s.status!='WATCH'||dist(s)<=1.5);
  // one zone per symbol+mode: best score, then closest to price
  const best={};r.forEach(s=>{const k=s.symbol+'|'+s.mode;const b=best[k];if(!b||s.score>b.score||(s.score==b.score&&dist(s)<dist(b)))best[k]=s});
  r=Object.values(best);
  // confluence: same symbol + same side in more than one mode
  const cf={};r.forEach(s=>{const k=s.symbol+'|'+s.plan.side;cf[k]=(cf[k]||0)+1});
  r.forEach(s=>s.cf=cf[s.symbol+'|'+s.plan.side]);
  const rank={TYPE3_CONFIRMED:0,TYPE2_TRIGGER:0,SET_LIMIT:1,WATCH:2};
  r.sort((a,b)=>b.cf-a.cf||rank[a.status]-rank[b.status]||b.score-a.score||dist(a)-dist(b));
  return r}
function draw(){
  bar('fq',QOPT,F.q,v=>F.q=v);
  bar('fm',['all','daily','monthly','quarterly'].map(v=>[v,NAME[v]]),F.mode,v=>F.mode=v);
  bar('fs',['all','BUY','SELL'].map(v=>[v,NAME[v]]),F.side,v=>F.side=v);
  bar('fx',SOPT,F.show,v=>F.show=v);
  if(!D)return;const r=pick();
  document.getElementById('cnt').textContent=`${r.length} setup${r.length==1?'':'s'} shown of ${D.signals.length} found`;
  document.getElementById('list').innerHTML=r.length?r.map(s=>{const p=s.plan,q=s.parts,d=dist(s).toFixed(1);
  return `<div class="c"><div class="t"><span><span class="sym">${s.symbol}</span> <span class="${p.side=='BUY'?'buy':'sell'}">${p.side}</span><span class="tag">${NAME[s.mode]}</span><span class="tag">${NAME[s.status]}</span>${s.cf>1?`<span class="tag hot">${s.cf} timeframes</span>`:''}</span><b>${s.score}</b></div>
  <div class="g"><div>Entry<b>${p.entry}</b></div><div>Stop<b>${p.sl}</b></div><div>Target 2:1<b>${p.target}</b></div><div>Qty<b>${s.lots?s.lots*s.lot:'—'}</b></div></div>
  <div class="m">Zone ${s.zone[0]}–${s.zone[1]} ${s.pattern}${s.lotl?' LOTL':''} · tested ${s.tests}× · CMP ${s.cmp} (${d}% from entry)<br>Fresh ${q.fresh} · Strength ${q.strength} · Base ${q.base} · EMA ${q.ema}<br>Curve ${s.loc.replace('_',' ').toLowerCase()} · trend ${s.itf_trend.toLowerCase()}${s.lots?'':' · risk too small for 1 lot'}</div></div>`}).join(''):'<div class="empty">No setups match. Loosen a filter.</div>';
}
fetch('results.json?'+Date.now()).then(r=>r.json()).then(d=>{D=d;
 document.getElementById('meta').textContent=`Updated ${d.updated} · ${d.scanned} scanned · capital ₹${d.capital.toLocaleString('en-IN')} @ ${d.risk_pct}% risk`+(d.errors.length?` · ${d.errors.length} skipped`:'');draw()})
 .catch(()=>{document.getElementById('meta').textContent='No results yet. Run the GTF scan workflow once.'});
draw();
</script></body></html>
